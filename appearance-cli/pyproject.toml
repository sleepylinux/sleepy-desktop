[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sleepy-appearance-cli"
requires-python = ">=3.13"
version = "0.2.0"
dependencies = [
    "pillow",
    "materialyoucolor"
]

[project.scripts]
sleepy = "sleepy:main"

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
]

[tool.ruff]
line-length = 120
